<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khoang Hành Lý Phương Tiện · GTA-Hub</title>
  <link rel="stylesheet" href="../shared/variables.css">
  <link rel="stylesheet" href="../shared/animations.css">
  <link rel="stylesheet" href="../shared/components.css">
  <link rel="stylesheet" href="../shared/themes/midnight_luxury_red.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="trunk-stage">
  <div class="trunk-backdrop" aria-hidden="true"></div>
  
  <main class="trunk-shell scale-open" id="trunkPanel">
    <!-- Left Column: Pocket Inventory -->
    <section class="trunk-board pocket-board">
      <header class="board-header">
        <div class="board-identity">
          <span class="board-emblem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          </span>
          <div>
            <h1>Túi đồ cá nhân</h1>
            <p>Vật phẩm trên người</p>
          </div>
        </div>
        <div class="board-meta">
          <span id="pocketWeightLabel">8.6 / 15.0 KG</span>
          <div class="weight-track"><span id="pocketWeightBar" style="width: 57.3%;"></span></div>
          <button class="close-btn" id="closeTrunkBtn" type="button" aria-label="Đóng khoang xe">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </header>
      <div class="board-subline">
        <span id="pocketSlotCounter">2 / 48 ô</span>
        <span>Kéo hoặc click để cất đồ</span>
      </div>
      <div class="slot-scroll">
        <div class="slot-grid" id="playerInvGrid" aria-label="48 ô túi đồ"></div>
      </div>
      <footer class="board-footer">
        <span><kbd>CLICK</kbd> Chọn item</span>
        <span><kbd>DRAG</kbd> Di chuyển</span>
      </footer>
    </section>

    <!-- Right Column: Vehicle Trunk -->
    <section class="trunk-board vehicle-board">
      <header class="board-header">
        <div class="board-identity">
          <span class="board-emblem vehicle-emblem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          </span>
          <div>
            <h2 id="vehicleTitle">Vapid Dominator</h2>
            <p id="vehiclePlate">Khoang xe · Biển số HUB-27</p>
          </div>
        </div>
        <div class="board-meta">
          <span id="vehicleWeightLabel">4.2 / 50.0 KG</span>
          <div class="weight-track"><span id="vehicleWeightBar" style="width: 8.4%;"></span></div>
        </div>
      </header>
      <div class="board-subline">
        <span id="vehicleSlotCounter">2 / 30 ô</span>
        <span>Thả item vào khoang xe này</span>
      </div>
      <div class="slot-scroll">
        <div class="slot-grid vehicle-grid" id="vehicleTrunkGrid" aria-label="30 ô khoang xe"></div>
      </div>
      <footer class="board-footer">
        <span><kbd>ESC</kbd> Đóng</span>
      </footer>
    </section>
  </main>

  <script src="../shared/cef.js"></script>
  <script src="app.js"></script>
</body>
</html>
