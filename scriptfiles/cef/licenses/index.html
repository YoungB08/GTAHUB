<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Andreas DMV & Driving School</title>
  <link rel="stylesheet" href="../shared/variables.css">
  <link rel="stylesheet" href="../shared/animations.css">
  <link rel="stylesheet" href="../shared/components.css">
  <link rel="stylesheet" href="../shared/themes/midnight_luxury_red.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/aaa-visual.css">
</head>
<body class="cef-stage">
  <div class="scene-shade"></div>
  
  <main class="cef-panel license-panel scale-open">
    <header class="panel-header">
      <div class="header-branding">
        <div class="brand-mark">STATE OF SAN ANDREAS · DMV</div>
        <h1 class="panel-title" id="licenseTitle">Đăng ký & Thi Bằng Lái</h1>
        <p class="panel-subtitle" id="licenseSubtitle">Trung tâm cấp chứng chỉ giao thông và vũ khí chính thức.</p>
      </div>

      <!-- Navigation Tabs -->
      <nav class="license-nav-tabs" aria-label="Menu bằng lái">
        <button class="nav-tab is-active" data-tab="hub" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Đăng ký thi</span>
        </button>
        <button class="nav-tab" data-tab="wallet" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          <span>Ví bằng lái</span>
        </button>
      </nav>

      <div class="license-header-actions">
        <span class="badge badge-step" id="questionCounter">DMV HUB</span>
        <button class="btn btn-icon btn-ghost" id="closeLicenses" type="button" aria-label="Đóng">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </header>

    <div class="license-content" id="licenseContent"></div>
  </main>

  <!-- QR Code PD Verification Modal -->
  <div class="qr-modal hidden" id="qrModal">
    <div class="qr-card scale-open">
      <button class="close-btn" id="qrCloseBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h3>XÁC THỰC GIẤY PHÉP (PD VERIFY)</h3>
      <div class="qr-preview">
        <img src="../shared/svg/qr.svg" alt="QR Verification" width="140">
      </div>
      <div class="verify-status" id="verifyStatus">
        <span>Mã thẻ: <b>SA-LIC-99218</b></span>
        <p class="text-success">✔ Giấy phép hợp lệ & còn thời hạn</p>
      </div>
    </div>
  </div>

  <script src="../shared/cef.js"></script>
  <script src="app.js"></script>
</body>
</html>
