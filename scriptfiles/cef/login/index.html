<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dang Nhap - GTAHUB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Glow orbs -->
    <div class="glow-orb glow-orb--tl"></div>
    <div class="glow-orb glow-orb--br"></div>

    <!-- Login panel -->
    <div class="glass-panel">

        <!-- Logo / Title -->
        <div class="panel-header">
            <img src="http://gtahub.kntech.co/gtahub.png" alt="GTAHUB" class="panel-logo">
            <h1 id="panel-title" class="panel-subtitle">ROLEPLAY <span class="accent">SYSTEM</span></h1>
        </div>

        <!-- Status message area -->
        <div id="status-msg" class="status-msg hidden"></div>

        <!-- Login form -->
        <div id="login-view" class="form-group-list">
            <p class="form-hint">Vui long dang nhap tai khoan de tiep tuc hanh trinh</p>

            <!-- Username -->
            <div class="field">
                <label class="field-label">Ten Tai Khoan / Email</label>
                <div class="field-wrap">
                    <svg class="field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <input type="text" id="username" placeholder="Nhap ten tai khoan...">
                </div>
            </div>

            <!-- Password -->
            <div class="field">
                <label class="field-label">Mat Khau</label>
                <div class="field-wrap">
                    <svg class="field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
            </div>

            <!-- Remember me / Forgot password -->
            <div class="field-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember-me">
                    Ghi nho toi
                </label>
                <a href="#" id="forgot-password" class="link-accent">Quen mat khau?</a>
            </div>

            <button id="login-btn" class="btn-primary">Dang Nhap Ngay</button>

            <!-- Register link -->
            <div class="register-link">
                Chua co tai khoan?
                <a href="../register/index.html" id="to-register-btn" class="link-accent link-bold">Tao tai khoan moi</a>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
